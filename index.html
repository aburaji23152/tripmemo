<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗車記録メモ</title>
    <!-- PWA / モバイル対応メタタグ -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="列車メモ">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        rail: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-16 antialiased">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="train-front" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">乗車記録メモ</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">Railway Travel & Delay Log</p>
                </div>
            </div>
            
            <button id="themeToggle" aria-label="テーマ切り替え" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i data-lucide="moon" id="themeIconMoon" class="w-5 h-5 block dark:hidden"></i>
                <i data-lucide="sun" id="themeIconSun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

        <!-- 入力フォームカード -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                    新しい記録を追加
                </h2>
                <span class="text-xs text-slate-400 dark:text-slate-500">* は必須項目</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- 乗車日 -->
                <div>
                    <label for="date" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">乗車日 <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="date" id="date" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <!-- 発時刻 -->
                <div>
                    <label for="time" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">発時刻 <span class="text-rose-500">*</span></label>
                    <input type="time" id="time" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                </div>

                <!-- 乗車駅 -->
                <div>
                    <label for="depStation" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">乗車駅 <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="text" id="depStation" placeholder="例: 東京" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <!-- 下車駅 -->
                <div>
                    <label for="arrStation" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">下車駅 <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="text" id="arrStation" placeholder="例: 新大阪" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <!-- 編成番号 -->
                <div>
                    <label for="trainNum" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">編成番号</label>
                    <input type="text" id="trainNum" placeholder="例: G12 / トウ01" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                </div>

                <!-- 遅延(発) & 遅延(着) -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label for="depDelay" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">遅延(発/分)</label>
                        <input type="number" id="depDelay" min="0" value="0" class="w-full px-3 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all text-center font-medium">
                    </div>
                    <div>
                        <label for="arrDelay" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">遅延(着/分)</label>
                        <input type="number" id="arrDelay" min="0" value="0" class="w-full px-3 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all text-center font-medium">
                    </div>
                </div>

                <!-- メモ(列車番号など) -->
                <div class="sm:col-span-2">
                    <label for="memo" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">メモ（列車番号・種別など）</label>
                    <input type="text" id="memo" placeholder="例: のぞみ21号 / 1234M" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                </div>
            </div>

            <!-- 追加ボタン -->
            <div class="mt-5">
                <button id="addBtn" class="w-full py-3 px-5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-[0.99] text-white font-bold text-sm shadow-sm shadow-emerald-500/20 flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    記録を追加する
                </button>
            </div>

            <!-- データ管理バー（CSVエクスポート・インポート） -->
            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="database" class="w-3.5 h-3.5"></i>
                        データ管理（CSVバックアップ・復元）
                    </span>
                    <div class="grid grid-cols-1 sm:flex sm:flex-wrap gap-2">
                        <button id="downloadDateBtn" class="px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/50 dark:hover:bg-amber-900/60 text-amber-700 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                            <i data-lucide="calendar-arrow-down" class="w-3.5 h-3.5"></i>
                            選択日のCSV出力
                        </button>
                        <button id="downloadBtn" class="px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/50 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800/60 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                            全記録のCSV出力
                        </button>
                        <label for="uploadFile" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                            CSVインポート
                        </label>
                        <input type="file" id="uploadFile" accept=".csv" class="hidden">
                    </div>
                </div>
            </div>
        </section>

        <!-- 記録一覧テーブルカード -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="list-ordered" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                    乗車履歴一覧
                </h2>
                <span id="recordCountBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">0件</span>
            </div>

            <div class="overflow-x-auto">
                <table id="recordTable" class="w-full text-left border-collapse min-w-[680px]">
                    <thead>
                        <tr class="bg-slate-50/90 dark:bg-slate-800/70 text-slate-500 dark:text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-200/80 dark:border-slate-800">
                            <th rowspan="2" class="py-3 px-4 font-semibold">乗車駅</th>
                            <th rowspan="2" class="py-3 px-3 font-semibold text-center">発時刻</th>
                            <th rowspan="2" class="py-3 px-4 font-semibold">下車駅</th>
                            <th colspan="2" class="pt-2 pb-1 px-2 font-semibold text-center border-b border-slate-200/60 dark:border-slate-700/60">遅延 (分)</th>
                            <th rowspan="2" class="py-3 px-3 font-semibold text-center">編成番号</th>
                            <th rowspan="2" class="py-3 px-4 font-semibold">メモ (列番)</th>
                            <th rowspan="2" class="py-3 px-4 font-semibold text-right w-32">操作</th>
                        </tr>
                        <tr class="bg-slate-50/90 dark:bg-slate-800/70 text-slate-500 dark:text-slate-400 text-[10px] border-b border-slate-200/80 dark:border-slate-800">
                            <th class="py-1.5 px-2 font-semibold text-center w-14">発</th>
                            <th class="py-1.5 px-2 font-semibold text-center w-14">着</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-800/80 text-sm">
                        <!-- JavaScriptで動的に描画 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- カスタム確認モーダル（confirm()の代替） -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200 dark:border-slate-800 transform transition-all">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center shrink-0">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
                <h3 id="modalTitle" class="text-base font-bold text-slate-900 dark:text-white">確認</h3>
            </div>
            <p id="modalMessage" class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed mb-6"></p>
            <div class="flex items-center justify-end gap-2.5">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors cursor-pointer">
                    キャンセル
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition-colors cursor-pointer">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- トースト通知（alert()の代替） -->
    <div id="toastContainer" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-max max-w-[90vw]"></div>

    <!-- JavaScriptファイル読み込み -->
    <script src="script.js"></script>
</body>
</html>
