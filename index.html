<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗車記録メモ</title>
    <!-- モダンなWebフォントとアイコン -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="列車メモ">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" href="./icon.png">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <div class="header-title">
                <div class="logo-badge">
                    <i data-lucide="train-front"></i>
                </div>
                <div>
                    <h1>乗車記録メモ</h1>
                    <p class="subtitle">Train Ride & Delay Log</p>
                </div>
            </div>
            <button id="themeToggle" class="icon-btn" aria-label="テーマ切り替え" title="テーマ切り替え">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </header>

        <!-- 入力フォームカード -->
        <section class="card form-section">
            <div class="section-header">
                <i data-lucide="plus-circle" class="accent-icon"></i>
                <h2>新しい記録を追加</h2>
            </div>

            <div class="form-grid">
                <div class="form-group span-2">
                    <label for="date">乗車日</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="depStation">乗車駅</label>
                    <input type="text" id="depStation" placeholder="例: 東京" required>
                </div>

                <div class="form-group">
                    <label for="time">発時刻</label>
                    <input type="time" id="time" required>
                </div>

                <div class="form-group">
                    <label for="arrStation">下車駅</label>
                    <input type="text" id="arrStation" placeholder="例: 品川" required>
                </div>

                <div class="form-group">
                    <label for="trainNum">編成番号</label>
                    <input type="text" id="trainNum" placeholder="例: U521">
                </div>

                <div class="form-group">
                    <label for="depDelay">遅延(発) [分]</label>
                    <input type="number" id="depDelay" placeholder="0" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="arrDelay">遅延(着) [分]</label>
                    <input type="number" id="arrDelay" placeholder="0" min="0" value="0">
                </div>

                <div class="form-group span-2">
                    <label for="memo">メモ (列車番号・種別など)</label>
                    <input type="text" id="memo" placeholder="例: 1234M 普通 / 車両点検のため遅延">
                </div>
            </div>

            <button id="addBtn" class="btn btn-primary">
                <i data-lucide="check"></i>
                <span>記録を追加</span>
            </button>

            <!-- CSV入出力アクション -->
            <div class="csv-actions">
                <button id="downloadDateBtn" class="btn btn-secondary">
                    <i data-lucide="calendar-arrow-down"></i>
                    <span>選択日のCSV出力</span>
                </button>
                <button id="downloadBtn" class="btn btn-secondary">
                    <i data-lucide="download"></i>
                    <span>全記録のCSV出力</span>
                </button>
                <label for="uploadFile" class="btn btn-outline file-upload-label">
                    <i data-lucide="upload"></i>
                    <span>CSVインポート</span>
                </label>
                <input type="file" id="uploadFile" accept=".csv">
            </div>
        </section>

        <!-- 記録一覧テーブルカード -->
        <section class="card table-card">
            <div class="table-wrapper">
                <table id="recordTable">
                    <thead>
                        <tr>
                            <th rowspan="2">乗車駅</th>
                            <th rowspan="2">発時刻</th>
                            <th rowspan="2">下車駅</th>
                            <th colspan="2" class="text-center">遅延(分)</th>
                            <th rowspan="2">編成番号</th>
                            <th rowspan="2">メモ(列番)</th>
                            <th rowspan="2" class="action-col">操作</th>
                        </tr>
                        <tr class="sub-header">
                            <th class="text-center">発</th>
                            <th class="text-center">着</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- 確認モーダル -->
    <div id="confirmModal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="modal-header">
                <i data-lucide="alert-triangle" class="danger-icon"></i>
                <h3 id="modalTitle">確認</h3>
            </div>
            <p id="modalMessage"></p>
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn btn-outline">キャンセル</button>
                <button id="modalConfirmBtn" class="btn btn-danger">削除する</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
